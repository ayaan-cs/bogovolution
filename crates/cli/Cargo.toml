[package]
name = "graft-rules"
description = "Evolve a repo's agent rules file (AGENTS.md, CLAUDE.md) against the repo's own tasks, with a hash-chained lineage log. The command is `graft`."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[[bin]]
name = "graft"
path = "src/main.rs"

[features]
default = ["watch"]
# The optional terminal view. Build with --no-default-features to leave it out.
watch = ["dep:graft-rules-watch"]

[dependencies]
graft-rules-core = { path = "../core", version = "4.0.0" }
graft-rules-watch = { path = "../watch", version = "4.0.0", optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile.workspace = true
serde_json.workspace = true
