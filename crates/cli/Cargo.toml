[package]
name = "rules-evolve-cli"
description = "Command line interface for rules-evolve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rules-evolve"
path = "src/main.rs"

[features]
default = ["watch"]
# The optional terminal view. Build with --no-default-features to leave it out.
watch = ["dep:rules-evolve-watch"]

[dependencies]
rules-evolve-core = { path = "../core" }
rules-evolve-watch = { path = "../watch", optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile.workspace = true
serde_json.workspace = true
