[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/watch"]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ayaan Syed"]
keywords = ["agents", "ai", "prompts", "evolution", "llm"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/ayaan-cs/graft"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
