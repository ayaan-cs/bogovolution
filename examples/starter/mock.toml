# Mock model for the starter (free, no network). It stands in for a real
# model so try.sh can prove the template works end to end: the checks are
# real Python tests, only the answers are canned. For each task the mock
# writes either the fixed file (pass_content) or the file as it is now
# (fail_content). The chance of the fixed file starts at
# base_pass_probability and moves when the rules contain a marker phrase.
# [[mutation]] lists the rule changes `mutate` and `evolve` can propose.
#
# On your own repo you do not need this file: use --provider local (a free
# model on your machine) or a paid provider. See STARTER.md.
seed = 5
base_pass_probability = 0.35
tokens_per_call = 400

# A general habit: helps every task, train and held out.
[[marker]]
text = "every case the docstring names"
delta = 0.55

# A narrow fix: helps one train task only, so held out does not move.
[[marker]]
text = "split on whitespace with str.split()"
delta = 0.5
tasks = ["word_count"]

[[mutation]]
hypothesis = "Most failures miss a case the docstring states, such as an error to raise, so a final pass over the docstring should catch them."
append = "Before you finish, check that the code handles every case the docstring names, including the errors it says to raise."

[[mutation]]
hypothesis = "One failure splits on a single space, so naming the right call should fix it."
append = "When counting words, split on whitespace with str.split() and no argument."

[[mutation]]
hypothesis = "Shorter names might make the code easier to follow."
append = "Prefer short variable names."

[[answer]]
task = "slugify"
path = "textkit/slug.py"
pass_content = '''
import re


def slugify(text):
    """Turn *text* into a URL slug.

    Lowercase, every run of characters that are not letters or digits
    becomes one hyphen, and no hyphen at either end.

        >>> slugify("Hello, World!")
        'hello-world'
    """
    return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
'''
