# graft starter: tasks.toml
#
# Copy this file to .graft/tasks.toml in your repo (after
# `graft init`) and replace the tasks with your own. As it stands it
# fits the sample repo next to it (sample-repo/), and try.sh runs it for free.
#
# How a task works:
#   1. graft copies your repo to a scratch folder, leaving out the
#      paths in [sandbox] hidden and exclude.
#   2. The model gets your rules file (AGENTS.md, CLAUDE.md, ...) and the
#      task prompt, plus the files listed in `context`, and answers with
#      whole files.
#   3. Its files are written into the copy, the hidden files are put back,
#      and the `check` command runs there (isolated: bwrap, podman or
#      docker). Exit code 0 is a pass, anything else a fail.
#   4. Every version of the rules runs the whole set several times
#      (`repeats` in config.toml). A new version is kept only when it beats
#      its parent on the median pass rate, wins enough paired runs, and also
#      gains on the held out tasks.
#
# Rules of thumb (STARTER.md has the reasons):
#   - Every task needs a check that passes or fails on its own, with no
#     person looking. Your existing tests are the best checks.
#   - Write the prompt the way a teammate would ask for the change: what is
#     wrong or wanted, one example, nothing about the hidden test.
#   - Start with 5 to 10 train tasks and 2 to 10 held out tasks.
#   - A task that always passes or always fails, whatever the rules say,
#     teaches nothing. Drop it after the first root run.

[sandbox]
# Benchmark files the model must never see. They are left out of the copy
# the model reads and put back only when the check runs. Put the real test
# logic here, not in the check command text (the model never sees `check`
# either, but keep it short). Paths or globs relative to the repo root:
# a path covers everything under it, `*` matches inside one folder, `**`
# any depth. Here: the whole checks/ folder of hidden tests.
hidden = ["checks"]

# Never copied at all (.git and .graft are always left out). Add
# build output and caches so copies stay small.
exclude = ["target", "node_modules", "__pycache__", ".venv"]

# Environment variables the check may read. Everything else is cleared, so
# API keys in your shell never reach a check. PATH is always kept.
env_passthrough = []

# Seconds before a check is killed, for tasks without their own timeout_secs.
default_timeout_secs = 60

# ---------------------------------------------------------------- train
# Train tasks: their prompts and failure notes are shown to the model that
# proposes rule changes, so the changes aim at these.

[[task]]
# Letters, digits, _, - and . only. Must be unique.
id = "slugify"
# What the agent is asked. Here it is the original bug report, word for
# word, the way a teammate filed it. No hint about the hidden test.
prompt = """
slugify("Hello, World!") returns "hello,-world!" but URLs need "hello-world".
Fix slugify in textkit/slug.py so punctuation and repeated separators turn
into single hyphens, with none at either end.
"""
# Run from the root of the scratch copy. Exit 0 means pass. One test
# module per task keeps tasks independent.
check = "python3 -m unittest -q checks.test_slugify"
# Files (or folders ending in /) the model is shown. A short list keeps the
# prompt small and cheap; leave it out to show every readable file.
context = ["textkit/slug.py"]

[[task]]
id = "word_count"
prompt = """
word_count("") says 1 and word_count("a\\tb") says 1. It should count words
split on any whitespace. Fix textkit/count.py.
"""
check = "python3 -m unittest -q checks.test_word_count"
context = ["textkit/count.py"]

[[task]]
id = "truncate"
prompt = """
truncate("abcdefghij", 6) returns "abcdef..." (9 characters), but the result
must be at most 6 characters including the suffix. Fix textkit/truncate.py
and make it follow its docstring.
"""
check = "python3 -m unittest -q checks.test_truncate"
context = ["textkit/truncate.py"]
# A task can have its own timeout.
timeout_secs = 30

[[task]]
id = "parse_bool"
# A feature request instead of a bug: the function is only a stub.
prompt = """
Implement parse_bool in textkit/boolean.py as its docstring describes. We
need it to read yes or no settings from config files.
"""
check = "python3 -m unittest -q checks.test_parse_bool"
context = ["textkit/boolean.py"]

[[task]]
id = "chunk"
prompt = """
chunk(items, 0) hangs our batch job forever. Make textkit/chunk.py follow
its docstring.
"""
check = "python3 -m unittest -q checks.test_chunk"
context = ["textkit/chunk.py"]

# ------------------------------------------------------------- held out
# Held out tasks run with every version but are never shown to the model
# that proposes changes. A change that only helps on train is called
# "overfit" instead of being kept. Pick tasks that fail sometimes, not
# always and not never (see STARTER.md).

[[task]]
id = "initials"
split = "held_out"
prompt = """
initials("ada  lovelace") crashes with IndexError when there are two
spaces. Fix textkit/initials.py.
"""
check = "python3 -m unittest -q checks.test_initials"
context = ["textkit/initials.py"]

[[task]]
id = "dedupe"
split = "held_out"
prompt = """
dedupe([3, 1, 3, 2, 1]) returns [1, 2, 3], sorted. It must keep the order
in which each item first appears: [3, 1, 2]. Fix textkit/dedupe.py.
"""
check = "python3 -m unittest -q checks.test_dedupe"
context = ["textkit/dedupe.py"]
