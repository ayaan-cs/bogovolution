# The honest example: 24 tasks, 16 train and 8 held out.
# Each task implements one function in kit/ from its docstring. Every
# behavior a hidden check tests (results, edge cases, error types) is
# stated in that docstring. checks/ is hidden from the model.

[sandbox]
hidden = ["checks"]

[[task]]
id = "parse_duration"
prompt = "Implement the function `parse_duration` in kit/parse_duration.py. Keep the signature and follow the docstring exactly. Write the whole file."
check = "python3 -B -m unittest checks.test_parse_duration"
timeout_secs = 30
context = ["kit/parse_duration.py"]

