# Demo tasks. Each task passes when the model writes "ok" to its answer file.
# check.sh is the hidden benchmark file: the model never sees it.

[sandbox]
hidden = ["check.sh"]

[[task]]
id = "task-01"
prompt = "Demo task 1: make the answer file for this task say ok."
check = "sh check.sh task-01"

